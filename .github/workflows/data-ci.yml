name: data-ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate candidate corpus boundary and integrity
        run: |
          python scripts/validate_openfda_candidates.py
      - name: Validate supplement-statement corpus boundary and integrity
        run: |
          python scripts/validate_openfda_supplement_statements.py --dir data/openfda_supplement_statements --terms data/openfda_supplement_statements/supplement_terms.json
      - name: Run tests
        run: |
          pytest -q
      - name: Ensure validated corpus is committed
        run: |
          git diff --exit-code -- data/openfda_candidates data/openfda_supplement_statements || (echo "::error::Validated corpus is not committed." && exit 1)
