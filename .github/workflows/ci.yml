name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic
      - name: Check the legacy interaction list (quarantined, not served)
        # data/interactions.csv has 103 known integrity errors (unknown source ids and
        # compounds, duplicate pairs). The application does not load or score it. The number
        # is a ratchet: this step fails if it rises, and also if it falls without the number
        # below being lowered to match.
        run: |
          python scripts/validate_data.py --known-errors 103

  frontend-build:
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install and build frontend
        run: |
          npm ci
          npm run build

  backend-smoke:
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
      - name: Run backend tests
        run: |
          python -m pip install --upgrade pip
          pytest -q
