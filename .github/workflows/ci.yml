name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic
      - name: Check the assessed interaction list
        # data/interactions.csv had 103 known integrity errors until 2026-11-19, when its
        # unsourced rows were re-sourced or removed. Any new error now fails this step.
        run: |
          python scripts/validate_data.py

  frontend-build:
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install and build frontend
        run: |
          npm ci
          npm run build

  backend-smoke:
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
      - name: Run backend tests
        run: |
          python -m pip install --upgrade pip
          pytest -q
