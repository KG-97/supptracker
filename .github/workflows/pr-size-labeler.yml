name: PR Size Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply size labels
        uses: codelytv/pr-size-labeler@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: 50
          s_max_size: 200
          m_max_size: 500
          l_max_size: 1000
          xl_max_size: 2000
